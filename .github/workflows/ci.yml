name: CI

on:
  pull_request:
    branches: [main]

# se você der outro push no mesmo PR, cancela a execução anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Formatação
        run: npm run format:check

      - name: Expo Doctor
        run: npx expo-doctor

      # gera o bundle JS sem build nativo: pega import quebrado e erro de sintaxe
      - name: Bundle (Android)
        run: npx expo export --platform android
